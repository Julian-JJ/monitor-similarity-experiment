# Diagnostic only: do not use these outputs as baseline results or performance measurements.
name = "cuda-debug-qwen3-1.7b"
monitors = ["qwen3-1.7b"]
rollout_sets = ["original_clean", "main_only_v1"]
told = ["malicious", "benign"]

[grid]
scope = ["action", "cot", "all"]
task_context = ["none"]
hierarchy = ["upstream-limits"]
partial_cot = ["off"]
followup_visibility = ["none"]
prompt = ["upstream_ad"]
reasoning = ["default"]

[options]
samples = 1
item_limit = 1     # One rollout per task/variant group; 9 rollouts / 54 units with current collections.
concurrency = 1
seed = 0
bin_size = 6
margin_tokens = 512
truncate_chars = 2000
labels = false
max_attempts = 2
single_pass_if_fits = true
keep_monitor_reasoning = false
