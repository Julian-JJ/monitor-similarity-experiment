# Monitor models an experiment may choose by name (see docs/system/registries.md).
#
# Every key is required except active_b, notes and reasoning_control. `verified` is false until the
# model has been downloaded and its revision pinned; entries marked "TBD" cannot be run until filled in.
# Chunk sizes are counted with ONE reference tokenizer for every monitor, so all monitors see identical
# observation chunks and only the model differs. Each call's real prompt size is read from the server.
reference_tokenizer = "cache/tokenizer/tokenizer.json"   # Qwen3-14B's tokenizer.json, pinned revision

[monitors.qwen3-14b]            # the same model as the fixed agent
model_id = "Qwen/Qwen3-14B"
revision = "40c069824f4251a91eefaf281ebe4c544efd3e18"
family = "qwen3"
size_b = 14
architecture = "dense"
provider = "cluster"
open_weights = true
base_url = "http://127.0.0.1:8000/v1"
context_tokens = 32768
output_reserve = 16768
thinking = true
verified = true
notes = "Installed on the cluster (29.6 GB). Used as the pilot monitor."
[monitors.qwen3-14b.sampling]
temperature = 0.6
top_p = 0.9
max_tokens = 16768

[monitors."qwen3-1.7b"]           # same family, smaller (exploratory)
